# Render Blueprint for Ad Decision (Adley Telegram bot)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: worker
    name: ad-decision
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ADLEY_DATA_DIR
        value: /opt/render/project/src/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
    disk:
      name: ad-decision-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
